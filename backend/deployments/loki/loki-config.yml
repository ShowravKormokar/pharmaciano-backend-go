# ──────────────────────────────────────────────────────────────────────────────
# Pharmaciano ERP — Loki Configuration (Production)
# ──────────────────────────────────────────────────────────────────────────────
# Single-node, local filesystem storage. Suitable for single-server deployments.
# For multi-tenancy, the X-Scope-OrgID header (set by the app's LokiAuditSink
# and by Promtail) maps to the "primary" tenant.
# ──────────────────────────────────────────────────────────────────────────────

auth_enabled: false   # single-tenant mode; X-Scope-OrgID still accepted

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ── Schema ────────────────────────────────────────────────────────────────────
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ── Storage ───────────────────────────────────────────────────────────────────
storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# ── Limits ────────────────────────────────────────────────────────────────────
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h    # 7 days
  max_query_length: 721h              # 30 days
  max_query_series: 10000
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  retention_period: 90d               # match audit retention

# ── Compactor ─────────────────────────────────────────────────────────────────
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# ── Chunk Store ───────────────────────────────────────────────────────────────
chunk_store_config:
  max_look_back_period: 90d

# ── Query Scheduler (single-node) ─────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

# ── Analytics ─────────────────────────────────────────────────────────────────
analytics:
  reporting_enabled: false
