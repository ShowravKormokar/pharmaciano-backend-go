# ──────────────────────────────────────────────────────────────────────────────
# Pharmaciano ERP — Production Prometheus Configuration
# ──────────────────────────────────────────────────────────────────────────────
# Scrapes: API, Worker, Redis Exporter, Postgres Exporter, Node Exporter,
#          Prometheus self-monitoring, Loki (optional).
# AlertManager target is set to the alertmanager container on the Docker network.
#
# Metrics endpoint is protected by Bearer token when telemetry.metrics.auth_token
# is set in the application config. Set METRICS_AUTH_TOKEN env var and the same
# token below under bearer_token.
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s          # default scrape interval
  evaluation_interval: 15s      # how often to evaluate alert rules
  scrape_timeout: 10s           # per-target timeout
  external_labels:              # propagated to remote_write and AlertManager
    cluster: pharmaciano-production
    environment: prod

# ── AlertManager ──────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Rule files ────────────────────────────────────────────────────────────────
rule_files:
  - "alerts.yml"

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # ── Pharmaciano API ─────────────────────────────────────────────────────────
  - job_name: pharmaciano-api
    metrics_path: /metrics
    # Uncomment bearer_token if METRICS_AUTH_TOKEN is configured:
    # bearer_token: "${METRICS_AUTH_TOKEN}"
    static_configs:
      - targets:
          - "api:8080"
        labels:
          service: api
          environment: prod

  # ── Pharmaciano Worker ──────────────────────────────────────────────────────
  - job_name: pharmaciano-worker
    metrics_path: /metrics
    # bearer_token: "${METRICS_AUTH_TOKEN}"
    static_configs:
      - targets:
          - "worker:8080"
        labels:
          service: worker
          environment: prod

  # ── Redis Exporter ──────────────────────────────────────────────────────────
  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
          environment: prod

  # ── Postgres Exporter ──────────────────────────────────────────────────────
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
          environment: prod

  # ── Node Exporter (host metrics) ───────────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          environment: prod

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"

  # ── Loki (optional; only if loki is running) ────────────────────────────────
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - "loki:3100"
        labels:
          service: loki
          environment: prod
