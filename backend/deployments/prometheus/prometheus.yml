global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # If you want to use AlertManager, add its address here.

rule_files:
  - "alerts.yml"

scrape_configs:
  # Scrape the API's metrics endpoint
  - job_name: 'pharmaciano-api'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'api:8080'   # service name inside Docker network
        labels:
          service: api

  # Scrape the worker's metrics if it exposes them (it does if we implement)
  # - job_name: 'pharmaciano-worker'
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #         - 'worker:8080'
  #       labels:
  #         service: worker

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'