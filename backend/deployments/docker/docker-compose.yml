# ──────────────────────────────────────────────────────────────────────────────
# Pharmaciano ERP — Docker Compose (Production-grade)
# ──────────────────────────────────────────────────────────────────────────────
# Core:       api, worker, migrate, seed
# Data:       postgres, redis
# Gateway:    nginx
# Observability: prometheus, grafana, loki, promtail, alertmanager,
#                redis-exporter, postgres-exporter, node-exporter
# Dev tools:  adminer, asynqmon (behind "dev" profile)
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Core application
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/api.Dockerfile
    container_name: pharmaciano-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pharmaciano
      DB_USER: pharmaciano
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-q9X5zYV7kzZfQm3hV9x9pKf2m7hTn4z5u8vW1x2y3zA=}
      FIELD_ENCRYPTION_KEY_ID: ${FIELD_ENCRYPTION_KEY_ID:-fe-2026-07}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-ChangeMe123!}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
      # ── Loki audit streaming ──
      AUDIT_LOKI_ENABLED: ${AUDIT_LOKI_ENABLED:-true}
      AUDIT_LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmaciano-net
    volumes:
      - api-uploads:/root/data/uploads
      - api-logs:/root/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/livez >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/worker.Dockerfile
    container_name: pharmaciano-worker
    restart: unless-stopped
    environment:
      APP_ENV: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pharmaciano
      DB_USER: pharmaciano
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-q9X5zYV7kzZfQm3hV9x9pKf2m7hTn4z5u8vW1x2y3zA=}
      FIELD_ENCRYPTION_KEY_ID: ${FIELD_ENCRYPTION_KEY_ID:-fe-2026-07}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-ChangeMe123!}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pharmaciano-net
    volumes:
      - worker-uploads:/root/data/uploads
      - worker-logs:/root/logs

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/api.Dockerfile
    container_name: pharmaciano-migrate
    restart: "no"
    command: ["./migrate", "-direction", "up"]
    environment:
      APP_ENV: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pharmaciano
      DB_USER: pharmaciano
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-q9X5zYV7kzZfQm3hV9x9pKf2m7hTn4z5u8vW1x2y3zA=}
      FIELD_ENCRYPTION_KEY_ID: ${FIELD_ENCRYPTION_KEY_ID:-fe-2026-07}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmaciano-net

  seed:
    build:
      context: ../..
      dockerfile: deployments/docker/api.Dockerfile
    container_name: pharmaciano-seed
    restart: "no"
    command: ["./seed-bin"]
    environment:
      APP_ENV: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pharmaciano
      DB_USER: pharmaciano
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-q9X5zYV7kzZfQm3hV9x9pKf2m7hTn4z5u8vW1x2y3zA=}
      FIELD_ENCRYPTION_KEY_ID: ${FIELD_ENCRYPTION_KEY_ID:-fe-2026-07}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:-4f8c2a9d7b6e3f1c9a2d4e7f8b1c3d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@pharmaciano.local}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-ChangeMe123!}
      SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Super}
      SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-Admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pharmaciano-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Data stores
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  postgres:
    image: postgres:16-alpine
    container_name: pharmaciano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmaciano
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: pharmaciano
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaciano"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaciano-net

  redis:
    image: redis:7-alpine
    container_name: pharmaciano-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pharmaciano-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Gateway
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  nginx:
    image: nginx:1.25-alpine
    container_name: pharmaciano-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pharmaciano-net

  api-docs:
    image: nginx:1.25-alpine
    container_name: pharmaciano-api-docs
    restart: unless-stopped
    ports:
      - "6060:80"
    volumes:
      - ../../api:/usr/share/nginx/html:ro
    networks:
      - pharmaciano-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Observability — Metrics
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pharmaciano-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - pharmaciano-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: pharmaciano-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - pharmaciano-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: pharmaciano-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
    networks:
      - pharmaciano-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Observability — Logs & Audit
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  loki:
    image: grafana/loki:2.9.6
    container_name: pharmaciano-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pharmaciano-net

  promtail:
    image: grafana/promtail:2.9.6
    container_name: pharmaciano-promtail
    restart: unless-stopped
    volumes:
      - ../promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - pharmaciano-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Observability — Exporters
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: pharmaciano-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - redis
    networks:
      - pharmaciano-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pharmaciano-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://pharmaciano:${DB_PASSWORD:-postgres}@postgres:5432/pharmaciano?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - pharmaciano-net

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: pharmaciano-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pharmaciano-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Dev tools (behind "dev" profile — opt-in with docker compose --profile dev)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  adminer:
    image: adminer:latest
    container_name: pharmaciano-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    profiles:
      - dev
    depends_on:
      - postgres
    networks:
      - pharmaciano-net

  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: pharmaciano-asynqmon
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 1
    profiles:
      - dev
    depends_on:
      - redis
    networks:
      - pharmaciano-net

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  pharmaciano-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  api-uploads:
  api-logs:
  worker-uploads:
  worker-logs:
