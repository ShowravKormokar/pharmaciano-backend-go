services:
  api:
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker
      LOG_LEVEL: debug
    volumes:
      - ../../config:/root/config:ro

  worker:
    environment:
      APP_ENV: docker
      LOG_LEVEL: debug
    volumes:
      - ../../config:/root/config:ro

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"