# =============================================================================
# Pharmaciano ERP — Default Configuration (committed)
# Overridden by config/config.<env>.yaml then by environment variables.
# =============================================================================

app:
  name: pharmaciano-erp
  env: dev
  version: 0.1.0
  timezone: Asia/Dhaka

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576
  body_limit_mb: 5
  upload_limit_mb: 25
  trust_proxy: true
  shutdown_timeout: 20s

cors:
  allow_origins:
    - http://localhost:3000
    - http://localhost:5173
  allow_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allow_headers:
    - Authorization
    - Content-Type
    - Idempotency-Key
    - X-Request-ID
    - X-Branch-ID
  expose_headers:
    - X-Request-ID
    - X-Total-Count
    - X-Next-Cursor
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
  allow_credentials: true
  max_age: 600

security:
  hsts:
    enabled: true
    max_age: 31536000
    include_subdomains: true
    preload: true
  csp: "default-src 'self'; frame-ancestors 'none'"
  x_frame_options: DENY
  x_content_type_options: nosniff
  referrer_policy: strict-origin-when-cross-origin

database:
  host: localhost
  port: 5432
  name: pharmaciano
  user: pharmaciano
  password: ""            # from env: DB_PASSWORD
  sslmode: disable
  timezone: UTC
  pool:
    max_conns: 25
    min_conns: 2
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m
    health_check_period: 1m
  statement_timeout: 30s
  read_replica:
    enabled: false
    host: ""
    port: 5432

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 2
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

asynq:
  redis_db: 1
  concurrency: 20
  strict_priority: true
  queues:
    critical: 6
    default: 3
    low: 1
  retry:
    max_retries: 25
    initial_delay: 1m
  dead_letter_ttl: 168h    # 7 days

jwt:
  issuer: pharmaciano
  audience: pharmaciano-users
  algorithm: HS256
  key_id: key-2026-07
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  clock_skew: 30s
  private_key_path: ""
  public_key_path: ""

refresh_cookie:
  name: mc_refresh
  domain: localhost
  path: /api/v1/auth
  secure: false
  httponly: true
  samesite: strict

password:
  argon2:
    memory_kb: 65536
    time: 3
    parallelism: 2
    key_length: 32
    salt_length: 16
  min_length: 10
  require_upper: true
  require_lower: true
  require_digit: true
  require_symbol: true
  history_size: 5

session:
  idle_timeout: 30m
  absolute_timeout: 168h
  max_concurrent_per_user: 10

rate_limit:
  enabled: true
  policies:
    public: { limit: 60,  window: 1m }
    auth_read: { limit: 300, window: 1m }
    auth_write: { limit: 120, window: 1m }
    login_per_email: { limit: 5,  window: 15m }
    login_per_ip: { limit: 20, window: 15m }
    refresh: { limit: 60, window: 1m }
    reset: { limit: 3,  window: 1h }
    pos_checkout: { limit: 30, window: 1m }
    search: { limit: 60, window: 1m }
    export: { limit: 5,  window: 1h }
    ai: { limit: 20, window: 1h }
    broadcast: { limit: 10, window: 1h }
    backup: { limit: 10, window: 24h }
    ws_connect: { limit: 10, window: 1m }

login_lockout:
  threshold: 5
  window: 15m
  duration: 15m

idempotency:
  ttl: 24h
  key_max_length: 128

casbin:
  model_path: config/casbin_model.conf
  autosave: true
  autoload_interval: 30s

logging:
  level: info
  format: json
  output: stdout
  file_path: ./logs/app.log
  sampling:
    enabled: false
    initial: 100
    thereafter: 100
  redact_fields:
    - password
    - password_hash
    - token
    - refresh_token
    - authorization
    - salary_encrypted
    - nid_number_encrypted

telemetry:
  metrics:
    enabled: true
    path: /metrics
    listen: "127.0.0.1:9091"
    auth_token: ""        # set on prod if :9091 reachable outside on firewall
  tracing:
    enabled: false
    service_name: pharmaciano-api
    exporter: otlp
    endpoint: http://localhost:4318
    insecure: true
    sampling_ratio: 0.1
  health:
    expose_errors: false  # Default: public /readyz - naver show raw error
    cache_ttl: 2s

websocket:
  read_buffer_bytes: 1024
  write_buffer_bytes: 1024
  max_message_bytes: 32768
  ping_interval: 25s
  pong_wait: 60s
  write_timeout: 10s
  origins_allowed:
    - http://localhost:3000
    - http://localhost:5173

pagination:
  default_limit: 20
  max_limit: 100
  cursor_secret_env: JWT_SECRET

ai:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  timeout: 30s
  max_tokens: 2048
  temperature: 0.2
  cost_cap_usd_per_day: 5
  forecast_cache_ttl: 6h
  circuit_breaker:
    error_threshold: 5
    timeout: 60s
    half_open_max: 3

storage:
  driver: local
  local_path: ./data/uploads
  max_file_size_mb: 25
  allowed_mime_types:
    - image/png
    - image/jpeg
    - image/webp
    - application/pdf
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

backup:
  enabled: true
  schedule: "0 2 * * *"
  local_path: ./data/backups
  retention_days: 30
  compress: true

features:
  ai_forecasting: false
  websocket_notifications: true
  ledger_autopost: true
  branch_transfers: true

audit:
  enabled: true
  async: true
  partition_by: month
  retention_days: 365
  archive_after_days: 90

super_admin:
  email: superadmin@pharmaciano.local
  first_name: Super
  last_name: Admin

organization_defaults:
  name: Pharmaciano Drug House
  slug: Pharmaciano-drug-house
  country: Bangladesh
  currency: BDT
  timezone: Asia/Dhaka
  subscription_plan: enterprise