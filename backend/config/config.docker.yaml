# =============================================================================
# Docker Compose overrides — loaded when APP_ENV=docker
# Hostnames match service names inside the compose network.
# =============================================================================

app:
  env: docker

server:
  host: 0.0.0.0
  port: 8080
  trust_proxy: true

cors:
  allow_origins:
    - http://localhost
    - http://localhost:3000
    - http://localhost:5173

database:
  host: postgres
  port: 5432
  name: pharmaciano
  user: pharmaciano
  sslmode: disable
  pool:
    max_conns: 20
    min_conns: 2

redis:
  host: redis
  port: 6379

asynq:
  concurrency: 15

jwt:
  algorithm: HS256
  access_token_ttl: 15m
  refresh_token_ttl: 168h

refresh_cookie:
  domain: ""                      # empty → default to request host
  secure: false                   # true when TLS terminates at Nginx
  samesite: strict

logging:
  level: info
  format: json
  output: stdout

telemetry:
  metrics:
    enabled: true
    listen: "0.0.0.0:9091"
  tracing:
    enabled: false
    endpoint: http://otel-collector:4318

rate_limit:
  enabled: true

ai:
  enabled: false                  # flip on when AI_API_KEY is provided

backup:
  enabled: true
  local_path: /data/backups
  schedule: "0 2 * * *"

storage:
  local_path: /data/uploads

pprof:
  enabled: false