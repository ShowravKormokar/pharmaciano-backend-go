# =============================================================================
# MediCore ERP — Casbin Model
# Hybrid RBAC + PBAC:
#   - Users get Roles (via g).
#   - Roles carry module:action permissions.
#   - Tenant isolation enforced by matching organization_id.
#   - Branch scope enforced via g2 (branch-role bindings) when set.
#
# Policy row (p):
#   sub  = role name          e.g. SUPER_ADMIN, MANAGER, JHON_SALESMAN
#   dom  = organization_id    e.g. UUID, or "*" for system roles
#   obj  = module             e.g. users, sales, inventory
#   act  = action             e.g. create, view, update, delete, approve
#   eft  = allow | deny
#
# Grouping (g):
#   user_id -> role_name (within dom)
#
# Grouping (g2):
#   role_name -> branch_id  (optional; enforces branch scope on writes)
# =============================================================================

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act, eft

[role_definition]
g  = _, _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = g(r.sub, p.sub, r.dom) \
    && (p.dom == r.dom || p.dom == "*") \
    && keyMatch(r.obj, p.obj) \
    && (p.act == r.act || p.act == "*")