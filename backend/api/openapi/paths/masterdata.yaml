# Central MasterData catalogues. All endpoints are protected and share the
# masterdata permissions; writes additionally require SUPER_ADMIN in the service.

/master/product-categories:
  post: &masterdata_create
    operationId: masterdata.productCategories.create
    summary: Create a product category
    security:
      - bearerAuth: []
    tags: [masterdata]
    description: Requires masterdata:create and the SUPER_ADMIN role.
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/RequestId'
      - $ref: '../components/parameters/pagination.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/masterdata.yaml#/CreateProductCategoryRequest'
    responses: &masterdata_create_responses
      '201':
        description: MasterData resource created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/CreatedEnvelope'
      '400':
        $ref: '../components/responses/error.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/error.yaml#/Forbidden'
      '409':
        $ref: '../components/responses/error.yaml#/Conflict'
      '422':
        $ref: '../components/responses/error.yaml#/UnprocessableEntity'
      '429':
        $ref: '../components/responses/error.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/error.yaml#/InternalError'
      '503':
        $ref: '../components/responses/error.yaml#/InternalError'
  get: &masterdata_list
    operationId: masterdata.productCategories.list
    summary: List product categories
    security:
      - bearerAuth: []
    tags: [masterdata]
    description: Requires masterdata:view. Results are central and shared across organizations.
    parameters: &masterdata_list_parameters
      - $ref: '../components/parameters/pagination.yaml#/RequestId'
      - $ref: '../components/parameters/pagination.yaml#/Page'
      - $ref: '../components/parameters/pagination.yaml#/Limit'
      - $ref: '../components/parameters/pagination.yaml#/Sort'
      - $ref: '../components/parameters/pagination.yaml#/Q'
      - name: is_active
        in: query
        description: Filter by active state.
        schema:
          type: boolean
      - name: parent_id
        in: query
        description: Parent filter; applies to product categories, drug classes and therapeutic classes only.
        schema:
          type: string
          format: uuid
    responses: &masterdata_list_responses
      '200':
        description: Paginated list of product categories.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/masterdata.yaml#/ProductCategoryResponse'
      '400':
        $ref: '../components/responses/error.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/error.yaml#/Forbidden'
      '429':
        $ref: '../components/responses/error.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/error.yaml#/InternalError'

/master/product-categories/{id}:
  parameters: &masterdata_item_parameters
    - $ref: '../components/parameters/pagination.yaml#/RequestId'
    - name: id
      in: path
      required: true
      description: MasterData resource UUID.
      schema:
        type: string
        format: uuid
  get: &masterdata_get
    operationId: masterdata.productCategories.get
    summary: Get a product category
    security:
      - bearerAuth: []
    tags: [masterdata]
    description: Requires masterdata:view.
    responses: &masterdata_get_responses
      '200':
        description: Product category.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/masterdata.yaml#/ProductCategoryResponse'
      '400':
        $ref: '../components/responses/error.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/error.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/error.yaml#/NotFound'
      '429':
        $ref: '../components/responses/error.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/error.yaml#/InternalError'
  patch: &masterdata_update
    operationId: masterdata.productCategories.update
    summary: Update a product category
    security:
      - bearerAuth: []
    tags: [masterdata]
    description: Requires masterdata:update and the SUPER_ADMIN role. Null PATCH values are treated as omitted.
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/masterdata.yaml#/UpdateProductCategoryRequest'
    responses: &masterdata_update_responses
      '200':
        description: Updated product category.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/masterdata.yaml#/ProductCategoryResponse'
      '400':
        $ref: '../components/responses/error.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/error.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/error.yaml#/NotFound'
      '409':
        $ref: '../components/responses/error.yaml#/Conflict'
      '422':
        $ref: '../components/responses/error.yaml#/UnprocessableEntity'
      '429':
        $ref: '../components/responses/error.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/error.yaml#/InternalError'
      '503':
        $ref: '../components/responses/error.yaml#/InternalError'
  delete: &masterdata_delete
    operationId: masterdata.productCategories.delete
    summary: Soft-delete a product category
    security:
      - bearerAuth: []
    tags: [masterdata]
    description: Requires masterdata:delete and the SUPER_ADMIN role. Returns 409 while the category has live references.
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/IdempotencyKey'
    responses: &masterdata_delete_responses
      '204':
        description: Product category soft-deleted.
      '400':
        $ref: '../components/responses/error.yaml#/BadRequest'
      '401':
        $ref: '../components/responses/error.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses/error.yaml#/Forbidden'
      '404':
        $ref: '../components/responses/error.yaml#/NotFound'
      '409':
        $ref: '../components/responses/error.yaml#/Conflict'
      '429':
        $ref: '../components/responses/error.yaml#/TooManyRequests'
      '500':
        $ref: '../components/responses/error.yaml#/InternalError'
      '503':
        $ref: '../components/responses/error.yaml#/InternalError'

