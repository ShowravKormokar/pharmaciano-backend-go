# MasterData DTOs — mirrors internal/modules/masterdata/dto.go.

MasterDataCreateBase:
  type: object
  required: [code, name]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 40
      description: Immutable after creation and unique among live rows.
    name:
      type: string
      minLength: 1
      description: Required display name. Maximum length is resource-specific.

MasterDataUpdateBase:
  type: object
  description: All properties are optional; code cannot be changed.

MasterDataResponseBase:
  type: object
  required: [id, code, name, is_active, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
    name:
      type: string
    is_active:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CreateProductCategoryRequest:
  allOf:
    - $ref: '#/MasterDataCreateBase'
    - type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        parent_id:
          type: [string, 'null']
          format: uuid
        description:
          type: [string, 'null']
        sort_order:
          type: [integer, 'null']
          minimum: 0
        is_active:
          type: [boolean, 'null']

UpdateProductCategoryRequest:
  allOf:
