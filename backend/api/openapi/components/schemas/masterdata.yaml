    - type: object
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 160
        parent_id:
          type: [string, 'null']
          format: uuid
          description: Null is treated as omitted; use a root assignment only where supported.
        description:
          type: [string, 'null']
        sort_order:
          type: [integer, 'null']
          minimum: 0
        is_active:
          type: [boolean, 'null']

ProductCategoryResponse:
  allOf:
    - $ref: '#/MasterDataResponseBase'
    - type: object
      properties:
        parent_id:
          type: string
          format: uuid
        description:
          type: string
        sort_order:
          type: integer

