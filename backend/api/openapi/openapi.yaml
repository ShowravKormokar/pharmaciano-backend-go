# ===========================================================================
# Pharmaciano ERP — API contract (single source of truth)
# ---------------------------------------------------------------------------
# OpenAPI 3.1. Autogenerated models/server come from this tree; do NOT edit
# anything under internal/api/gen by hand. Author paths in paths/*.yaml and
# schemas in components/schemas/*.yaml, then re-bundle + re-generate.
#
# Build pipeline (see Makefile oapi-* targets):
#   redocly bundle openapi.yaml -o build/openapi.bundled.yaml   # single spec
#   oapi-codegen -config config/oapi-codegen.yaml build/openapi.bundled.yaml
#   scalac-to-go ...                                           # strict-server
# ===========================================================================

openapi: 3.1.0
info:
  title: Pharmaciano ERP API
  version: 1.0.0
  description: |
    The public HTTP contract for the Pharmaciano ERP — a multi-branch pharmacy ERP.
    Every response is wrapped in a standard Envelope; every error is a catalogue error
    (code → HTTP status), see the individual operation docs.

    ## Conventions

    - **Base path** `/api/v1`. A future `/api/v2` will coexist without breaking v1.
    - **Auth** — `Authorization: Bearer <access-token>` (`bearerAuth`). Callers without a
      token hit 401 on protected routes.
    - **Envvelope** — successful bodies look like `{ "success": true, "data": ... }`; list
      operations add `"pagination": { ... }`. Errors look like
      `{ "success": false, "error": { "code": ..., "message": ... } }`.
    - **Idempotency** — mutating methods accept an optional `Idempotency-Key` header.
    - **Correlation** — every response carries `X-Request-ID` (mirrored in `meta.request_id`).
  contact:
    name: Pharmaciano Engineering
  termsOfService: https://example.com/terms
  license:
    name: Proprietary
  x-versioning:
    current: 1
    supported: [1, 2]
    deprecationPolicy: |
      A deprecated v1 path stays served for a grace period (Sunset header) before being
      removed with 410 ENDPOINT_REMOVED. Bug fixes ship on both major versions during overlap.

servers:
  - url: https://api.example.com/api/v1
    description: Production v1
  - url: https://api.example.com/api/v2
    description: Production v2
  - url: https://api.dev.example.com/api/v1
    description: Development v1
  - url: https://api.dev.example.com/api/v2
    description: Development v2

security:
  - bearerAuth: []

tags:
  - name: health
    description: Liveness and readiness probes.
  - name: auth
    description: Login, session lifecycle, MFA and password flows.
  - name: users
    description: User identity, CRUD, status and role/branch assignments.
  - name: branches
    description: Organization branches.
  - name: organizations
    description: Tenant identity and settings.
  - name: warehouses
    description: Inventory storage locations.
  - name: rbac
    description: Roles and permissions.

