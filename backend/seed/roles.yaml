      - "branches:view"
      - "warehouses:view"
      - "masterdata:view"
      - "brands:view"
      - "manufacturers:view"
      - "suppliers:view"
      - "medicines:view"
      - "inventory:view"
      - "inventory:export"
      - "purchases:view"
      - "purchases:export"
      - "purchase_payments:create"
      - "purchase_payments:view"
      - "purchase_payments:update"
      - "purchase_payments:delete"
      - "sales:view"
      - "sales:export"
      - "sales:refund"
      - "customers:view"
      - "customers:export"
      - "coupons:view"
      - "ledger:view"
