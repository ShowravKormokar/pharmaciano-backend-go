  # ----- OPERATIONS / FRONT DESK --------------------------------------------

  - name: PHARMACIST
    description: "Dispenses medicine, handles prescriptions, records sales. Cannot delete or change price."
    is_system: true
    is_active: true
    priority: 40
    scope: branch
    permissions:
