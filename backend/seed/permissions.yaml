# =============================================================================
# Pharmaciano ERP — Permissions Catalog
#
# Format: module:action
# Every write endpoint requires one permission from this catalog.
# Loaded by cmd/seed on first boot (idempotent upsert by (module, action)).
# is_system=true → cannot be deleted through the API.
# =============================================================================

version: 1
description: "Default permission catalog for Pharmaciano ERP. All entries are system permissions."

permissions:

  # --------------------------------------------------------------------------
  # Identity & Access
  # --------------------------------------------------------------------------
  - module: users
    action: create
    description: "Create a new user account (SUPER_ADMIN only in practice)."
    is_system: true
  - module: users
    action: view
    description: "List and view user profiles."
    is_system: true
  - module: users
    action: update
    description: "Update user profile, status, stage, employment info."
    is_system: true
  - module: users
    action: delete
    description: "Soft-delete a user (revokes sessions, disables login)."
    is_system: true
  - module: users
    action: assign
    description: "Assign a role or branch scope to a user."
    is_system: true
  - module: users
    action: revoke
    description: "Revoke a role assignment from a user."
    is_system: true
  - module: users
    action: export
    description: "Export users list as CSV/XLSX."
    is_system: true

  - module: roles
    action: create
    description: "Create a dynamic role (e.g. JHON_SALESMAN)."
    is_system: true
  - module: roles
    action: view
    description: "List and view roles and their permissions."
    is_system: true
  - module: roles
    action: update
    description: "Rename or change description of a non-system role."
    is_system: true
  - module: roles
    action: delete
    description: "Delete a non-system role."
    is_system: true
  - module: roles
    action: assign
    description: "Assign or replace permissions on a role."
    is_system: true

  - module: permissions
    action: view
    description: "Read the permission catalog."
    is_system: true

  - module: sessions
    action: view
    description: "List active sessions (SUPER_ADMIN sees system-wide)."
    is_system: true
  - module: sessions
    action: revoke
    description: "Force-logout a user or a specific device."
    is_system: true

  # --------------------------------------------------------------------------
  # Organization / Branch / Warehouse
  # --------------------------------------------------------------------------
  - module: organizations
    action: view
    description: "View own organization details."
    is_system: true
  - module: organizations
    action: update
    description: "Edit organization profile, licenses, contact info."
    is_system: true

  - module: branches
    action: create
    description: "Create a branch under the organization."
    is_system: true
  - module: branches
    action: view
    description: "List and view branches."
    is_system: true
  - module: branches
    action: update
    description: "Edit branch details."
    is_system: true
  - module: branches
    action: delete
    description: "Soft-delete a branch."
    is_system: true

  - module: warehouses
    action: create
    description: "Create a warehouse under a branch."
    is_system: true
  - module: warehouses
    action: view
    description: "List and view warehouses."
    is_system: true
  - module: warehouses
    action: update
    description: "Edit warehouse details."
    is_system: true
  - module: warehouses
    action: delete
    description: "Soft-delete a warehouse."
    is_system: true

  # --------------------------------------------------------------------------
  # Master Data (categories, dosage forms, routes, package types, unit types,
  # storage conditions, tax rates, drug groups/classes/therapeutic classes,
  # generic medicines) — grouped under a single permission surface.
  # --------------------------------------------------------------------------
  - module: masterdata
    action: create
    description: "Create master data entries (category, dosage form, route, etc.)."
    is_system: true
  - module: masterdata
    action: view
    description: "Read master data entries."
    is_system: true
  - module: masterdata
    action: update
    description: "Update master data entries."
    is_system: true
  - module: masterdata
    action: delete
    description: "Soft-delete master data entries."
    is_system: true

  - module: brands
    action: create
    is_system: true
  - module: brands
    action: view
    is_system: true
  - module: brands
    action: update
    is_system: true
  - module: brands
    action: delete
    is_system: true

  - module: manufacturers
    action: create
    is_system: true
  - module: manufacturers
    action: view
    is_system: true
  - module: manufacturers
    action: update
    is_system: true
  - module: manufacturers
    action: delete
    is_system: true

  - module: suppliers
    action: create
    is_system: true
  - module: suppliers
    action: view
    is_system: true
  - module: suppliers
    action: update
    is_system: true
  - module: suppliers
    action: delete
    is_system: true

  # --------------------------------------------------------------------------
  # Medicine Catalog
  # --------------------------------------------------------------------------
  - module: medicines
    action: create
    description: "Create a medicine in the central catalog."
    is_system: true
  - module: medicines
    action: view
    description: "Search and view medicines."
    is_system: true
  - module: medicines
    action: update
    description: "Edit medicine details (SUPER_ADMIN/ADMIN)."
    is_system: true
  - module: medicines
    action: delete
    description: "Soft-delete a medicine."
    is_system: true
  - module: medicines
