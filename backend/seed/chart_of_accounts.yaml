# =============================================================================
# Pharmaciano ERP — Chart of Accounts (Default)
#
# Standard 5-block layout: Assets (1xxx), Liabilities (2xxx), Equity (3xxx),
# Revenue (4xxx), Expenses (5xxx-6xxx).
#
# `normal_side` is the natural balance side (debit or credit).
# `is_system=true` means the account is required by auto-posting rules and
# cannot be deleted through the API.
# `parent` refers to another account by `code` to build the hierarchy.
# =============================================================================

version: 1
description: "Default Chart of Accounts for a pharmacy retail organization."

accounts:

  # =========================================================================
  # 1000 — ASSETS
  # =========================================================================
  - code: "1000"
    name: "Assets"
